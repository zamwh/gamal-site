<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة — جمال المشرقي</title>
<link rel="icon" href="/img/logo_night.png">
<link rel="stylesheet" href="/css/site.css?v=11251930">
<style>
body{background:var(--bg)}
.lay{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{border-inline-start:0;border-left:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;background:var(--bg2)}
aside img{height:74px;width:auto;margin:0 6px 20px;align-self:flex-start}
aside button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:4px;color:var(--mut);font-family:Alex;font-size:14.5px;text-align:right;transition:.4s}
aside button:hover{color:var(--ink);background:var(--card)}
aside button.on{color:var(--btn-ink);background:var(--gg)}
aside .sp{flex:1}
aside .who{font-size:12.5px;color:var(--faint);font-family:Alex;padding:0 6px}
.mainp{padding:28px 34px 60px;min-width:0}
.top2{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.top2 h1{font-family:Naskh;font-size:30px;margin:0;flex:1}
.rng{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.rng button{font-family:Alex;font-size:13px;padding:6px 14px;border-radius:99px;color:var(--mut)}
.rng button.on{background:var(--gold);color:var(--btn-ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kp{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:18px 20px}
.kp small{font-family:Alex;color:var(--mut);font-size:12.5px;display:block}
.kp b{font-family:Num;font-size:34px;font-weight:600;display:block;line-height:1.3;direction:ltr;text-align:right}
.kp .d{font-size:12px;font-family:Alex;color:var(--faint)}
.kp .d.up{color:var(--ok)}.kp .d.dn{color:#e08a7a}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.box{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:20px;min-width:0}
.box h3{font-family:Naskh;font-size:19px;margin:0 0 4px}
.box .sub{font-size:12.5px;color:var(--mut);font-family:Alex;margin-bottom:14px}
svg.ch{width:100%;height:220px;display:block}
.ch .ax{stroke:var(--line);stroke-width:1}
.ch text{fill:var(--faint);font-size:11px;font-family:Alex}
.fn{display:grid;gap:8px}
.fr{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;font-size:13.5px}
.fr .bar{height:30px;background:var(--card2);border-radius:3px;overflow:hidden;position:relative}
.fr .bar i{position:absolute;inset:0 0 0 auto;background:var(--gg);border-radius:3px;transition:width 1.2s var(--ease)}
.fr .v{font-family:Num;direction:ltr;text-align:left}
.fr .v small{color:var(--faint);font-family:Alex;font-size:11.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;font-family:Alex;font-weight:500;color:var(--mut);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{font-family:Num;direction:ltr;text-align:right}
td img{width:44px;height:52px;object-fit:cover;border-radius:3px}
.tag{font-family:Alex;font-size:11.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:currentColor}.tag.w{color:var(--warn);border-color:currentColor}.tag.x{color:#e08a7a;border-color:currentColor}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card2{width:min(400px,100%);border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:34px}
.login img{height:110px;margin:0 auto 18px}
.list2 div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.list2 b{font-family:Num;direction:ltr}
.scn td,.scn th{font-size:12.5px}
.chatlog{max-height:520px;overflow:auto}
.chatlog .mg{max-width:100%;margin-bottom:6px}
.est{font-family:Alex;font-size:11px;color:var(--warn);border:1px solid currentColor;border-radius:99px;padding:1px 8px;margin-inline-start:6px}
.mes{font-family:Alex;font-size:11px;color:var(--ok);border:1px solid currentColor;border-radius:99px;padding:1px 8px;margin-inline-start:6px}
@media (max-width:900px){.lay{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-left:0;border-bottom:1px solid var(--line)}aside img{height:44px;margin:0}aside .sp,aside .who{display:none}
.kpis{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.mainp{padding:18px}.fr{grid-template-columns:110px 1fr 70px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="/js/admin.js?v=11280050"></script>
</body>
</html>
